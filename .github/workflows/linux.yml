name: Linux

on:
  push:
    branches: [ started-project-flutter ]
  # pull_request:
  #   branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5 # flutter --version || Flutter 3.35.5

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "jetbrains"
          
      - name: Create ENV APP_VERSION
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | tr -d '[:space:]' | tr -d '\r')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: BUILD APK
        run: |
          flutter build apk --release --dart-define APP_VERSION=$APP_VERSION

      - name: BUILD WEB
        run: |
          flutter build web --release --dart-define APP_VERSION=$APP_VERSION

      - name: BUILD AAB
        run: |
          flutter build appbundle --release --dart-define APP_VERSION=$APP_VERSION

